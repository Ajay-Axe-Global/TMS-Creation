<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/auth/client.js"></script>
<script>if (!Auth.token) location.replace("/login");</script>
<title>TMS Platform — Emvia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }

  ::selection { background: #3b82f6; color: #fff; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; border-bottom: 1px solid #1e293b;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
  }
  .brand span { font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: -0.01em; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  #user-name { font-size: 13px; font-weight: 500; color: #e2e8f0; }
  header button {
    background: transparent; border: 1px solid #334155; color: #94a3b8;
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-weight: 500; font-family: inherit; transition: border-color .15s, color .15s, background .15s;
  }
  header button:hover { border-color: #475569; color: #e2e8f0; background: #1e293b; }

  .tracking-container { width: 100%; margin: 0 auto; padding: 40px 40px 64px; }
  @media (max-width: 480px) { .tracking-container { padding: 24px 16px 48px; } header { padding: 14px 20px; } }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    color: #64748b; cursor: pointer; text-decoration: none; margin-bottom: 18px;
    background: none; border: none; font-family: inherit; padding: 0;
  }
  .back-link:hover { color: #94a3b8; }

  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-size: 24px; font-weight: 700; color: #f8fafc; letter-spacing: -0.015em; margin-bottom: 6px; }
  .page-header p { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #64748b; }

  /* ── Notices ── */
  .notice {
    display: none; border-radius: 10px; padding: 11px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.5;
    border: 1px solid transparent;
  }
  .notice.show { display: block; }
  .notice.ok   { background: #0f2b1c; border-color: #14532d; color: #86efac; }
  .notice.warn { background: #3f2d0f; border-color: #7c4a12; color: #fcd34d; }
  .notice.err  { background: #2b1414; border-color: #5a2a2a; color: #fca5a5; }
  .notice.info { background: #172033; border-color: #334155; color: #93c5fd; }
  .notice ul { margin: 6px 0 0 18px; }

  /* ── Toolbar: search left, counts + Create right ── */
  .table-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
  .search-wrap .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: #64748b; font-size: 13px; pointer-events: none;
  }
  #search-input {
    width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 9px;
    padding: 9px 12px 9px 32px; color: #e2e8f0; font-family: inherit; font-size: 13px;
  }
  #search-input:focus { outline: none; border-color: #3b82f6; }
  #search-input::placeholder { color: #64748b; }
  .toolbar-actions { display: flex; gap: 14px; align-items: center; }
  .counts { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #64748b; }
  #create-btn {
    background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; color: #fff;
    border-radius: 9px; padding: 9px 22px; font-weight: 700; font-size: 12.5px;
    cursor: pointer; font-family: inherit; transition: opacity .15s;
  }
  #create-btn:hover:not(:disabled) { opacity: .92; }
  #create-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ── Table ── */
  .tracking-table-wrap {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow-x: auto;
  }
  table.tracking-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.tracking-table th {
    text-align: left; padding: 13px 16px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .05em; color: #64748b; font-weight: 700; border-bottom: 1px solid #334155;
    background: #172033; white-space: nowrap;
  }
  table.tracking-table td {
    padding: 13px 16px; border-bottom: 1px solid #26334a; color: #cbd5e1; vertical-align: middle;
  }
  table.tracking-table tr:last-child td { border-bottom: none; }
  table.tracking-table tr:hover td { background: #1c2942; }
  table.tracking-table tr.selected td { background: #1c2942; }
  table.tracking-table td.mono { font-family: 'JetBrains Mono', monospace; color: #e2e8f0; }
  table.tracking-table td.num-cell { color: #64748b; font-family: 'JetBrains Mono', monospace; }
  .empty-cell { color: #475569; }
  .row-checkbox, .select-all-checkbox { width: 15px; height: 15px; accent-color: #3b82f6; cursor: pointer; }
  .row-checkbox:disabled { cursor: not-allowed; opacity: .35; }

  /* An ITOS number's containers sit together: the group's first row carries a stronger
     divider, and its continuation rows dim the shipment-level cells (still in the DOM for
     search and the narrow-screen card layout). */
  table.tracking-table tr.group-start td { border-top: 1px solid #3b4a63; }
  table.tracking-table tr.group-start:first-child td { border-top: none; }
  table.tracking-table tr.cont td.ship { color: #3a475e; }
  table.tracking-table tr.cont td.ship .empty-cell { color: #2a3548; }

  /* Dragging a file over any row of an ITOS group highlights the whole group. */
  table.tracking-table tr.drag-over td { background: #1d3557; border-color: #2563eb; }

  /* ── Files cell ── */
  .file-drop {
    display: flex; align-items: center; gap: 8px; min-width: 170px; max-width: 230px;
    border: 1px dashed #334155; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #64748b;
  }
  .file-drop.editable { cursor: pointer; }
  .file-drop.editable:hover { border-color: #3b82f6; color: #93c5fd; }
  .file-drop.has-file { border-style: solid; border-color: #334155; color: #cbd5e1; cursor: default; }
  .file-drop .fname {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e2e8f0;
    background: none; border: none; font: inherit; text-align: left; cursor: pointer; padding: 0;
  }
  .file-drop .fname:hover { color: #93c5fd; text-decoration: underline; }
  .file-drop .fsize { color: #64748b; font-size: 11px; white-space: nowrap; }
  .file-drop .fx {
    background: none; border: none; color: #64748b; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px;
  }
  .file-drop .fx:hover { color: #f87171; }
  .file-drop.missing .fname { color: #f87171; }
  .file-drop.uploading { opacity: .6; pointer-events: none; }

  /* ── Status cell ── */
  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  }
  .status-badge.queued, .status-badge.running { background: #1a2233; color: #93c5fd; }
  .status-badge.running { animation: pulse 1.4s ease-in-out infinite; }
  .status-badge.done { background: #0f2b1c; color: #86efac; }
  .status-badge.dry_run { background: #0f2b2b; color: #5eead4; }
  .status-badge.failed { background: #2b1414; color: #fca5a5; }
  .status-badge.needs_relogin { background: #3f2d0f; color: #fbbf24; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .status-badge.running { animation: none; } }
  .status-note { font-size: 11px; margin-top: 4px; color: #64748b; max-width: 260px; line-height: 1.4; }
  .status-note.err { color: #f87171; }

  .tracking-empty { text-align: center; padding: 48px 24px; color: #64748b; font-size: 13px; }
  .tracking-error {
    text-align: center; padding: 40px 24px; color: #fca5a5; font-size: 13.5px;
    background: #2b1414; border: 1px solid #5a2a2a; border-radius: 14px;
  }

  /* ── Confirm dialog ── */
  .confirm-overlay {
    display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, .7);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .confirm-overlay.open { display: flex; }
  .confirm-box {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 24px 26px; width: 100%; max-width: 420px;
  }
  .confirm-title { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
  .confirm-message { font-size: 13.5px; color: #94a3b8; line-height: 1.55; margin-bottom: 20px; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .confirm-actions button {
    border-radius: 9px; padding: 9px 20px; font-weight: 700; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .confirm-cancel-btn { background: transparent; border: 1px solid #334155; color: #94a3b8; }
  .confirm-cancel-btn:hover { border-color: #475569; color: #e2e8f0; }
  .confirm-ok-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; color: #fff; }

  /* Card layout on narrow screens */
  @media (max-width: 640px) {
    table.tracking-table thead { display: none; }
    table.tracking-table, table.tracking-table tbody, table.tracking-table tr, table.tracking-table td {
      display: block; width: 100%;
    }
    table.tracking-table tr { padding: 12px 14px; border-bottom: 1px solid #26334a; }
    table.tracking-table td {
      border-bottom: none; padding: 5px 0; display: flex; justify-content: space-between; align-items: center;
    }
    table.tracking-table td::before {
      content: attr(data-label); color: #64748b; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: .05em; font-weight: 700;
    }
    table.tracking-table td.blank { display: none; }
    table.tracking-table tr.cont td.ship { color: #cbd5e1; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">T</div>
      <span>TMS Platform</span>
    </div>
    <div class="header-right">
      <span id="user-name"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="tracking-container">
    <a class="back-link" id="back-link" href="/dashboard">← Back</a>
    <div class="page-header">
      <h1 id="client-title">Emvia</h1>
      <p>One row per container — containers of the same ITOS number are grouped. Select shipments and click Create; drop a file on a row to attach it.</p>
    </div>

    <div class="notice" id="call-banner" role="status"></div>
    <div class="notice" id="notice" role="status"></div>

    <div class="table-toolbar" id="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search ITOS, client ref, container, BL…" />
      </div>
      <div class="toolbar-actions">
        <div class="counts" id="counts"></div>
        <button type="button" id="create-btn" disabled>Create</button>
      </div>
    </div>

    <div class="tracking-table-wrap" id="table-wrap">
      <table class="tracking-table">
        <thead>
          <tr>
            <th><input type="checkbox" class="select-all-checkbox" id="select-all" aria-label="Select all" /></th>
            <th>S.No</th>
            <th>ITOS</th>
            <th>Client Ref</th>
            <th>Carrier</th>
            <th>Container No</th>
            <th>Type</th>
            <th>Seal</th>
            <th>BL</th>
            <th>File No</th>
            <th>TMS</th>
            <th>Files</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="tracking-empty" id="empty" style="display:none;"></div>
    </div>
    <div class="tracking-error" id="error" style="display:none;"></div>
  </div>

  <input type="file" id="file-input" style="display:none" />

  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <div class="confirm-title" id="confirm-title">Create in TMS?</div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="confirm-actions">
        <button type="button" class="confirm-cancel-btn" id="confirm-cancel-btn">Cancel</button>
        <button type="button" class="confirm-ok-btn" id="confirm-ok-btn">Create</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const $ = id => document.getElementById(id);
      // /app/emvia/<client_slug>/  ->  the client this page is for
      const clientSlug = location.pathname.split("/").filter(Boolean)[2];
      const base = `/app/emvia/${encodeURIComponent(clientSlug)}`;

      let shipments = [];
      let me = { tms_login: true };
      let createEnabled = false;
      const selected = new Set();
      let pollTimer = null;
      let uploadTarget = null;

      $("logout-btn").addEventListener("click", () => Auth.logout());

      const STATUS_LABEL = { queued: "Queued", running: "Running", done: "Created", failed: "Failed",
        needs_relogin: "Needs re-login", dry_run: "Dry run OK" };
      const fmtSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;

      // One table cell. `label` feeds the narrow-screen card layout; empty values show a dash.
      const cell = (label, v, cls = "") => {
        const empty = v === null || v === undefined || v === "";
        return `<td class="${cls}" data-label="${label}">${empty ? '<span class="empty-cell">—</span>' : esc(v)}</td>`;
      };
      const blank = (label) => `<td class="blank" data-label="${label}"></td>`;

      // ── notices ──
      function notice(el, kind, html) {
        el.className = `notice ${kind}${html ? " show" : ""}`;
        el.innerHTML = html || "";
      }

      // ── rendering ──
      function filtered() {
        const q = $("search-input").value.trim().toLowerCase();
        // A shipment stays whole if any of its rows match, so the ITOS group keeps its context.
        return shipments.filter(s => !q || [
          s.itos_no, s.client_ref, s.carrier, s.bl_number, s.tms_file_no, s.file && s.file.name,
          ...s.containers.flatMap(c => [c.container_no, c.container_type, c.seal_no, c.tms_order_no]),
        ].some(v => v && String(v).toLowerCase().includes(q)));
      }

      function filesCell(s) {
        const editable = s.selectable;
        if (s.file) {
          return `<td data-label="Files"><div class="file-drop has-file${s.file.missing ? " missing" : ""}" data-sid="${s.id}">
            <button type="button" class="fname" data-download="${s.id}" title="${esc(s.file.name)}${s.file.missing ? " — missing on the server, upload it again" : ""}">${esc(s.file.name)}</button>
            <span class="fsize">${fmtSize(s.file.size)}</span>
            ${editable ? `<button type="button" class="fx" data-remove="${s.id}" title="Remove file" aria-label="Remove file">✕</button>` : ""}
          </div></td>`;
        }
        if (editable) {
          return `<td data-label="Files"><div class="file-drop editable" data-sid="${s.id}" data-browse="${s.id}" title="Drop a file here, or click to choose one">
            <span>📎 Drop file here</span></div></td>`;
        }
        return `<td data-label="Files"><span class="empty-cell">—</span></td>`;
      }

      function statusCell(s) {
        if (s.tms_status === "not_started") return `<td data-label="Status"><span class="empty-cell">—</span></td>`;
        let note = "";
        if (s.activity && s.activity.message && (s.tms_status === "queued" || s.tms_status === "running"))
          note = `<div class="status-note">${esc(s.activity.message)}</div>`;
        else if (s.tms_error)
          note = `<div class="status-note ${s.tms_status === "dry_run" ? "" : "err"}">${esc(s.tms_error)}</div>`;
        return `<td data-label="Status"><span class="status-badge ${s.tms_status}">${esc(STATUS_LABEL[s.tms_status] || s.tms_status)}</span>${note}</td>`;
      }

      function render() {
        const shown = filtered();
        // Only selectable shipments can stay selected (one that just queued is no longer).
        for (const id of [...selected]) {
          const s = shipments.find(x => x.id === id);
          if (!s || !s.selectable) selected.delete(id);
        }

        let n = 0, containers = 0;
        $("rows").innerHTML = shown.map(s => {
          const rows = s.containers.length ? s.containers : [null];   // a shipment with no containers still shows
          return rows.map((c, i) => {
            if (c) containers++;
            n++;
            const first = i === 0;
            return `<tr class="${first ? "group-start" : "cont"}${selected.has(s.id) ? " selected" : ""}" data-sid="${s.id}">
              ${first
                ? `<td class="checkbox-cell" data-label="Select"><input type="checkbox" class="row-checkbox" data-id="${s.id}" ${selected.has(s.id) ? "checked" : ""} ${s.selectable ? "" : "disabled"} aria-label="Select ${esc(s.itos_no)}" /></td>`
                : blank("Select")}
              <td class="num-cell" data-label="S.No">${n}</td>
              ${cell("ITOS", s.itos_no, "mono ship")}
              ${cell("Client Ref", s.client_ref, "ship")}
              ${cell("Carrier", s.carrier, "ship")}
              ${cell("Container No", c && c.container_no, "mono")}
              ${cell("Type", c && c.container_type)}
              ${cell("Seal", c && c.seal_no, "mono")}
              ${cell("BL", s.bl_number, "mono ship")}
              ${cell("File No", s.tms_file_no, "mono ship")}
              ${cell("TMS", c && c.tms_order_no, "mono")}
              ${first ? filesCell(s) : blank("Files")}
              ${first ? statusCell(s) : blank("Status")}
            </tr>`;
          }).join("");
        }).join("");

        $("counts").textContent = `${shown.length} shipment${shown.length === 1 ? "" : "s"} · ${containers} container${containers === 1 ? "" : "s"}`;
        const empty = $("empty");
        empty.style.display = shown.length ? "none" : "block";
        empty.textContent = shipments.length ? "No shipments match your search." : "No shipments for this client yet.";

        const selectable = shown.filter(s => s.selectable);
        const picked = selectable.filter(s => selected.has(s.id)).length;
        const all = $("select-all");
        all.checked = selectable.length > 0 && picked === selectable.length;
        all.indeterminate = picked > 0 && picked < selectable.length;
        all.disabled = selectable.length === 0;
        $("create-btn").disabled = selected.size === 0 || !me.tms_login;
        $("create-btn").textContent = selected.size ? `Create (${selected.size})` : "Create";

        // The phone call: the one moment the user must act, so it is never buried in a row.
        const mine = shipments.filter(s => s.activity && s.activity.mine);
        const calling = mine.find(s => s.activity.kind === "calling");
        const failedCall = mine.find(s => s.activity.kind === "call_failed");
        notice($("call-banner"), calling ? "warn" : failedCall ? "warn" : "",
          calling ? "📞 <strong>TMS is calling your phone</strong> — answer it and press <strong>#</strong>."
          : failedCall ? "📞 The call was not answered — trying again. Please answer and press <strong>#</strong>." : "");

        if (!me.tms_login) notice($("notice"), "err", "No TMS login is set for your account — ask an administrator to add it before creating.");

        // Keep status fresh while anything is in flight.
        clearTimeout(pollTimer);
        if (shipments.some(s => s.tms_status === "queued" || s.tms_status === "running")) pollTimer = setTimeout(refresh, 2500);
      }

      async function refresh() {
        try {
          const data = await api(`${base}/data`);
          shipments = data.shipments;
          me = data.me;
          createEnabled = data.create_enabled;
          render();
        } catch (e) {
          clearTimeout(pollTimer);
          pollTimer = setTimeout(refresh, 5000);   // transient (restart, network): keep trying
        }
      }

      // ── selection ──
      $("rows").addEventListener("change", e => {
        if (!e.target.classList.contains("row-checkbox")) return;
        const id = +e.target.dataset.id;
        e.target.checked ? selected.add(id) : selected.delete(id);
        render();
      });
      $("select-all").addEventListener("change", e => {
        const targets = filtered().filter(s => s.selectable);
        targets.forEach(s => e.target.checked ? selected.add(s.id) : selected.delete(s.id));
        render();
      });
      $("search-input").addEventListener("input", render);

      // ── Create ──
      function confirmDialog(title, message, okLabel) {
        return new Promise(resolve => {
          $("confirm-title").textContent = title;
          $("confirm-message").innerHTML = message;
          $("confirm-ok-btn").textContent = okLabel;
          $("confirm-overlay").classList.add("open");
          const done = v => { $("confirm-overlay").classList.remove("open"); cleanup(); resolve(v); };
          const ok = () => done(true), cancel = () => done(false);
          const key = e => { if (e.key === "Escape") cancel(); };
          const cleanup = () => {
            $("confirm-ok-btn").removeEventListener("click", ok);
            $("confirm-cancel-btn").removeEventListener("click", cancel);
            document.removeEventListener("keydown", key);
          };
          $("confirm-ok-btn").addEventListener("click", ok);
          $("confirm-cancel-btn").addEventListener("click", cancel);
          document.addEventListener("keydown", key);
        });
      }

      $("create-btn").addEventListener("click", async () => {
        const picked = shipments.filter(s => selected.has(s.id));
        if (!picked.length) return;
        const containers = picked.reduce((a, s) => a + s.containers.length, 0);
        const what = `<strong>${picked.length}</strong> shipment${picked.length === 1 ? "" : "s"} (${containers} container${containers === 1 ? "" : "s"})`;
        const ok = await confirmDialog(
          "Create in TMS?",
          createEnabled
            ? `Create ${what} in TMS under your own TMS login. A browser will open, sign in (you may get a phone call to answer), and create the orders.`
            : `${what} will be sent through TMS in <strong>dry-run mode</strong>: a browser signs in under your TMS login and reaches the Orders list, but <strong>nothing is created</strong>.`,
          createEnabled ? "Create" : "Run dry run");
        if (!ok) return;

        $("create-btn").disabled = true;
        try {
          const r = await api(`${base}/create`, { method: "POST", body: { shipment_ids: picked.map(s => s.id) } });
          const q = r.queued.length;
          const parts = [];
          if (q) parts.push(`Queued <strong>${q}</strong> shipment${q === 1 ? "" : "s"}. A browser will open shortly.`);
          if (r.skipped.length) parts.push(`Not queued:<ul>${r.skipped.map(x => `<li><strong>${esc(x.itos_no || "#" + x.shipment_id)}</strong> — ${esc(x.reason)}</li>`).join("")}</ul>`);
          notice($("notice"), q ? (r.skipped.length ? "warn" : "ok") : "err", parts.map(x => `<div>${x}</div>`).join(""));
          selected.clear();
        } catch (e) {
          notice($("notice"), "err", esc(e.message));
        }
        await refresh();
      });

      // ── files: drop on any row of a shipment, or click the cell ──
      async function upload(sid, file) {
        const holder = document.querySelector(`.file-drop[data-sid="${sid}"]`);
        if (holder) holder.classList.add("uploading");
        const form = new FormData();
        form.append("file", file);
        try {
          const res = await fetch(`${base}/shipments/${sid}/file`, {
            method: "POST", headers: { Authorization: "Bearer " + Auth.token }, body: form });
          if (res.status === 401) { Auth.logout(); return; }
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
          notice($("notice"), "ok", `Attached <strong>${esc(data.name)}</strong> to ${esc((shipments.find(s => s.id === sid) || {}).itos_no || "the shipment")}.`);
        } catch (e) {
          notice($("notice"), "err", esc(e.message));
        }
        await refresh();
      }

      const groupRows = sid => document.querySelectorAll(`#rows tr[data-sid="${sid}"]`);
      const clearDrag = () => document.querySelectorAll("#rows tr.drag-over").forEach(r => r.classList.remove("drag-over"));
      const rowSid = e => { const tr = e.target.closest && e.target.closest("tr[data-sid]"); return tr ? +tr.dataset.sid : null; };
      const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files");

      // A file dropped outside a row must not make the browser open it.
      window.addEventListener("dragover", e => e.preventDefault());
      window.addEventListener("drop", e => { e.preventDefault(); clearDrag(); });

      $("rows").addEventListener("dragover", e => {
        const sid = rowSid(e);
        const s = shipments.find(x => x.id === sid);
        if (!hasFiles(e) || !s || !s.selectable) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        clearDrag();
        groupRows(sid).forEach(r => r.classList.add("drag-over"));
      });
      $("rows").addEventListener("dragleave", e => {
        if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest("#rows")) clearDrag();
      });
      $("rows").addEventListener("drop", e => {
        const sid = rowSid(e);
        clearDrag();
        const s = shipments.find(x => x.id === sid);
        if (!hasFiles(e) || !s) return;
        e.preventDefault();
        e.stopPropagation();
        if (!s.selectable) { notice($("notice"), "err", "This shipment is already queued or created — its file can no longer be changed."); return; }
        const files = [...e.dataTransfer.files];
        if (!files.length) return;
        if (files.length > 1) notice($("notice"), "warn", `Only one file per shipment — using <strong>${esc(files[0].name)}</strong>.`);
        upload(sid, files[0]);
      });

      $("rows").addEventListener("click", async e => {
        const dl = e.target.closest("[data-download]");
        const rm = e.target.closest("[data-remove]");
        const br = e.target.closest("[data-browse]");
        if (dl) {
          const sid = +dl.dataset.download;
          try {
            const res = await fetch(`${base}/shipments/${sid}/file`, { headers: { Authorization: "Bearer " + Auth.token } });
            if (!res.ok) throw new Error("The file is not available.");
            const url = URL.createObjectURL(await res.blob());
            const a = document.createElement("a");
            a.href = url; a.download = (shipments.find(s => s.id === sid).file || {}).name || "file";
            document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
          } catch (err) { notice($("notice"), "err", esc(err.message)); }
        } else if (rm) {
          const s = shipments.find(x => x.id === +rm.dataset.remove);
          if (!confirm(`Remove "${s.file.name}" from ${s.itos_no}?`)) return;
          try { await api(`${base}/shipments/${s.id}/file`, { method: "DELETE" }); }
          catch (err) { notice($("notice"), "err", esc(err.message)); }
          await refresh();
        } else if (br) {
          uploadTarget = +br.dataset.browse;
          $("file-input").value = "";
          $("file-input").click();
        }
      });
      $("file-input").addEventListener("change", e => {
        if (e.target.files.length && uploadTarget) upload(uploadTarget, e.target.files[0]);
      });

      function showError(message) {
        $("table-wrap").style.display = "none";
        $("toolbar").style.display = "none";
        $("error").style.display = "block";
        $("error").textContent = message;
      }

      (async function init() {
        try {
          const info = await api("/api/auth/me");
          $("user-name").textContent = info.name;
          $("back-link").href = info.role === "admin" ? "/admin" : "/dashboard";
          const data = await api(`${base}/data`);
          $("client-title").textContent = data.client.name;
          document.title = `TMS Platform — ${data.client.name}`;
          shipments = data.shipments;
          me = data.me;
          createEnabled = data.create_enabled;
          render();
        } catch (e) {
          showError(e.message === "Forbidden — you do not have access to this client"
            ? "You do not have access to this client. Ask an administrator."
            : e.message);
        }
      })();
    })();
  </script>
</body>
</html>
