<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TMS Platform — Choose a client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <link rel="stylesheet" href="/auth/dashboard.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">T</span>
      <span class="brand-name">TMS Platform</span>
    </div>
    <div class="header-right">
      <span class="avatar" id="user-avatar">?</span>
      <span id="user-name"></span>
      <button class="theme-toggle" id="theme-btn"></button>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Log out</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Choose a client</h1>
    <p class="sub">This account has access to these clients.</p>
    <div class="grid" id="grid"></div>
  </main>

  <script src="/auth/client.js"></script>
  <script src="/auth/dashboard.js"></script>
</body>

</html>
